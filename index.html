        .modal-backdrop { background-color: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .animate-in { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        

        /* ===== Deadline Alert Slider ===== */
        #deadline-slider-wrap {
            max-width: 1220px;
            margin: 12px auto 0;
            padding: 0 16px;
            overflow: hidden;
            max-height: 0;
            opacity: 0;
            transition: max-height 0.55s cubic-bezier(0.4,0,0.2,1), opacity 0.4s ease, margin 0.4s ease;
        }
        #deadline-slider-wrap.show {
            max-height: 120px;
            opacity: 1;
            margin-top: 12px;
        }
        #deadline-slider-inner {
            background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 100%);
            border: 1.5px solid #fca5a5;
            border-left: 5px solid #ef4444;
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            position: relative;
        }
        #deadline-slider-inner .bell-icon {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: #fee2e2;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            animation: bellRing 1.2s ease-in-out infinite;
        }
        @keyframes bellRing {
            0%, 100% { transform: rotate(0deg); }
            15%       { transform: rotate(12deg); }
            30%       { transform: rotate(-10deg); }
            45%       { transform: rotate(8deg); }
            60%       { transform: rotate(-6deg); }
            75%       { transform: rotate(3deg); }
        }
        #deadline-slider-close {
            position: absolute; top: 10px; right: 12px;
            background: none; border: none; cursor: pointer;
            color: #f87171; font-size: 15px; line-height: 1;
            opacity: 0.7; transition: opacity 0.2s;
        }
        #deadline-slider-close:hover { opacity: 1; }
        #deadline-slider-text { font-size: 13.5px; color: #991b1b; line-height: 1.55; }
        #deadline-slider-text strong { color: #7f1d1d; }
        #deadline-slider-text .job-list { font-weight: 700; color: #b91c1c; }


        /* ===== Sort Dropdown ===== */
        .sort-wrapper { position: relative; display: inline-block; }
        .sort-btn {
            display: flex; align-items: center; gap: 7px;
            background: white; border: 1px solid #e2e8f0;
            border-radius: 10px; padding: 7px 13px;
            font-size: 13.5px; font-weight: 600; color: #475569;
            cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            transition: border-color 0.15s, box-shadow 0.15s;
            white-space: nowrap; user-select: none;
        }
        .sort-btn:hover { border-color: #6366f1; color: #6366f1; }
        .sort-btn.active { border-color: #6366f1; color: #6366f1; background: #eef2ff; }
        .sort-btn i.chevron { font-size: 10px; transition: transform 0.2s; }
        .sort-btn.open i.chevron { transform: rotate(180deg); }
        .sort-menu {
            position: absolute; right: 0; top: calc(100% + 6px);
            background: white; border: 1px solid #e2e8f0;
            border-radius: 12px; padding: 5px;
            min-width: 210px; z-index: 200;
            box-shadow: 0 8px 24px rgba(0,0,0,0.10);
            opacity: 0; transform: translateY(-6px) scale(0.97);
            pointer-events: none;
            transition: opacity 0.15s ease, transform 0.15s ease;
        }
        .sort-menu.open {
            opacity: 1; transform: translateY(0) scale(1);
            pointer-events: all;
        }
        .sort-option {
            display: flex; align-items: center; gap: 9px;
            padding: 8px 12px; border-radius: 8px;
            font-size: 13px; font-weight: 500; color: #475569;
            cursor: pointer; transition: background 0.1s;
        }
        .sort-option:hover { background: #f1f5f9; color: #1e293b; }
        .sort-option.selected { background: #eef2ff; color: #6366f1; font-weight: 700; }
        .sort-option i { width: 16px; text-align: center; font-size: 12px; color: #94a3b8; }
        .sort-option.selected i { color: #6366f1; }
        .sort-divider { height: 1px; background: #f1f5f9; margin: 4px 0; }

        /* Dynamic Urgency Classes */
        .urgency-safe { border-left: 4px solid #10b981 !important; background-color: #f0fdf4; }
        .urgency-warning { border-left: 4px solid #f59e0b !important; background-color: #fffbeb; }
        .urgency-danger { border-left: 4px solid #ef4444 !important; background-color: #fef2f2; }

        /* ===== Profile Card ===== */
.profile-card {

/* ===== Profile Details ===== */

/* ===== Contact Items ===== */
.contact-item {

/* Links */

    text-decoration: underline;
}

/* Static text */

/* ===== Profile Photo ===== */
.profile-photo-container {
    width: 110px;
    height: 110px;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    cursor: pointer;
    border: 1px solid #e2e8f0;
}

.profile-photo {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* Hover Overlay */
.photo-overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: 0.3s ease;
}

.profile-photo-container:hover .photo-overlay {
    opacity: 1;
}

/* ===== Responsive Fix ===== */
@media (max-width: 640px) {
    .profile-card {
        padding: 16px;
    }

    .profile-photo-container {
        width: 90px;
        height: 90px;
    }
}

        // --- Core Functions ---
        
        function getUrgencyClass(app) {
            // Only apply logic if "Date Applied" is empty
            if (app.dateApplied && app.dateApplied.trim() !== "") return "";
            if (!app.lastDate) return "";

            const today = new Date();
            today.setHours(0,0,0,0);
            const deadline = new Date(app.lastDate);
            deadline.setHours(0,0,0,0);
            
            const diffTime = deadline - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            if (diffDays < 3) return "urgency-danger";
            if (diffDays <= 7) return "urgency-warning";
            return "urgency-safe";
        }

        function handleFile(input, type) {
            const file = input.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                currentFiles[type] = { name: file.name, url: url };
                document.getElementById(`${type}-label`).innerText = file.name;
                document.getElementById(`${type}-label`).classList.add('text-indigo-600', 'font-semibold');
            }
        }

        function downloadFile(url, filename) {
            if (!url) {
                alert("Demo file: In a real app, the uploaded file would download here.");
                return;
            }
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function parseSalary(salaryStr) {
            if (!salaryStr) return 0;
            // Extract first number from strings like "$150k - $180k" or "$250k+"
            const match = salaryStr.replace(/,/g, '').match(/[\d.]+/);
            if (!match) return 0;
            let val = parseFloat(match[0]);
            if (salaryStr.toLowerCase().includes('k')) val *= 1000;
            if (salaryStr.toLowerCase().includes('m')) val *= 1000000;
            return val;
        }

        function sortApplications(arr) {
            const sorted = [...arr];
            switch (currentSort) {
                case 'newest':
                    return sorted.sort((a, b) => b.id.localeCompare(a.id));
                case 'oldest':
                    return sorted.sort((a, b) => a.id.localeCompare(b.id));
                case 'salary-high':
                    return sorted.sort((a, b) => parseSalary(b.salary) - parseSalary(a.salary));
                case 'salary-low':
                    return sorted.sort((a, b) => parseSalary(a.salary) - parseSalary(b.salary));
                case 'deadline-soon':
                    return sorted.sort((a, b) => {
                        if (!a.lastDate) return 1;
                        if (!b.lastDate) return -1;
                        return new Date(a.lastDate) - new Date(b.lastDate);
                    });
                case 'deadline-late':
                    return sorted.sort((a, b) => {
                        if (!a.lastDate) return 1;
                        if (!b.lastDate) return -1;
                        return new Date(b.lastDate) - new Date(a.lastDate);
                    });
                default:
                    return sorted;
            }
        }

        function handleProfilePhoto(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('profile-img').src = e.target.result;
                saveProfile();
            };
            reader.readAsDataURL(file);
        }

        function saveApplications() {
            localStorage.setItem('applications', JSON.stringify(applications));
        }

        function saveProfile() {
            const profile = {
                name: document.getElementById('user-name').value,
                image: document.getElementById('profile-img').src
            };

            localStorage.setItem('profile', JSON.stringify(profile));
        }

        function loadProfile() {
            const saved = JSON.parse(localStorage.getItem('profile'));
            if (!saved) return;

            if (saved.name) {
                document.getElementById('user-name').value = saved.name;
            }

            if (saved.image) {
                document.getElementById('profile-img').src = saved.image;
            }
        }

        async function saveApplicationsToFirebase() {
            // ⚡ Never deletes — only upserts changed/new docs using batched writes
            try {
                const BATCH_SIZE = 450;
                for (let i = 0; i < applications.length; i += BATCH_SIZE) {
                    const batch = db.batch();
                    const chunk = applications.slice(i, i + BATCH_SIZE);
                    chunk.forEach(app => {
                        const ref = db.collection("applications").doc(app.id);
                        batch.set(ref, app, { merge: true }); // merge:true preserves any extra fields
                    });
                    await batch.commit();
                }
            } catch (err) {
                console.warn("Firebase save failed, data is safe in localStorage:", err);
            }
        }

        async function loadApplicationsFromFirebase() {
            try {
                const snapshot = await db.collection("applications").get();
                if (snapshot.empty) return; // keep local data already rendered

                const firebaseApps = [];
                snapshot.forEach(doc => firebaseApps.push({ id: doc.id, ...doc.data() }));

                applications = firebaseApps;
                saveApplications(); // sync back to localStorage
                renderApplications(); // re-render with fresh Firebase data
            } catch (err) {
                console.warn("Firebase load failed, using cached local data:", err);
            }
        }

        window.onload = () => {
            loadProfile();

            // ⚡ Render instantly from localStorage (zero wait)
            renderApplications();

            // 🔥 Then sync with Firebase in the background (non-blocking)
            loadApplicationsFromFirebase().then(() => updateDeadlineSlider());

            // Show deadline slider from local data immediately
            updateDeadlineSlider();
        };


        // ===== DEADLINE SLIDER BANNER =====
        function getUrgentApps() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return applications.filter(app => {
                if (!app.lastDate) return false;
                const deadline = new Date(app.lastDate);
                deadline.setHours(0, 0, 0, 0);
                const diffDays = Math.ceil((deadline - today) / (1000 * 60 * 60 * 24));
                return diffDays >= 0 && diffDays <= 3;
            });
        }

        function closeDeadlineSlider() {
            document.getElementById('deadline-slider-wrap').classList.remove('show');
        }

        function updateDeadlineSlider() {
            const criticalJobs = getUrgentApps();
            const wrap = document.getElementById('deadline-slider-wrap');
            const textEl = document.getElementById('deadline-slider-text');

            if (criticalJobs.length === 0) {
                wrap.classList.remove('show');
                return;
            }

            const jobNames = criticalJobs
                .map(j => `<span class="job-list">"${j.company} — ${j.role}"</span>`)
                .join(', ');

            textEl.innerHTML = `
                <strong>⚠️ You have ${criticalJobs.length} job${criticalJobs.length > 1 ? 's' : ''} closing within 3 days!</strong>
                Please apply soon. The post${criticalJobs.length > 1 ? 's' : ''} ${criticalJobs.length > 1 ? 'are' : 'is'}: ${jobNames}
            `;

            // Slide in after a short delay so it animates on load
            requestAnimationFrame(() => {
                setTimeout(() => wrap.classList.add('show'), 120);
            });
        }



    </script>
